<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Library</title>
  <!-- favicon: переместил в public и исправил путь -->
  <link rel="icon" type="image/svg+xml" href="/book-person.svg" />
</head>
<body>

  <header class="header">
    <div class="header__logo">
      <!-- logo: путь исправлен на public -->
      <img src="/book.svg" alt="Logo" class="header__logo-icon" />
      <div class="header__brand">
        <span class="header__brand-name">The Library</span>
        <span class="header__brand-sub">Discover your next favorite book</span>
      </div>
    </div>
    <!-- Theme.js render button theme -->
    <div id="theme-toggle-container"></div>
  </header>

  <section class="hero">
    <h1 class="hero__title">Discover Your Next Great Read</h1>
    <p class="hero__subtitle">
      Search millions of books, build your personal library,
      and never lose track of what to read next.
    </p>
    <!-- Search.js render search form -->
    <div id="search-container"></div>
    <!-- Filter.js rendet filter by author-->
    <div id="filter-container"></div>
  </section>

  <main class="main-layout">
    <section class="results-section">
      <p class="results-title" id="results-title"></p>
      <!-- BookCard.js rebder card -->
      <div class="books-grid" id="books-grid" aria-live="polite"></div>
    </section>

    <!-- Favorites.js render sidebar -->
    <div id="favorites-container"></div>
  </main>

  <footer class="footer">
    Powered by
    <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
